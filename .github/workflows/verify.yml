name: Verify accounting
on:
  push:
    branches: [implementation/sqlite-flutter]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlite-results
          path: reports/
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - name: Inspect Flutter and Android toolchains
        working-directory: app
        continue-on-error: true
        run: flutter doctor -v 2>&1 | tee ../reports/flutter-doctor.log
      - working-directory: app
        run: flutter pub get 2>&1 | tee ../reports/flutter-pub-get.log
      - working-directory: app
        run: flutter analyze 2>&1 | tee ../reports/flutter-analyze.log
      - working-directory: app
        run: timeout 180s flutter test --reporter expanded --timeout 2m 2>&1 | tee ../reports/flutter-test.log
      - working-directory: app
        run: flutter build apk --debug --dart-define=APP_ENV=demo 2>&1 | tee ../reports/flutter-build.log
      - name: Verify APK and record checksum
        run: |
          test -s app/build/app/outputs/flutter-apk/app-debug.apk
          sha256sum app/build/app/outputs/flutter-apk/app-debug.apk > reports/app-debug.apk.sha256
      - name: Upload Flutter diagnostics and resolved dependencies
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-verification-results
          path: |
            reports/flutter-*.log
            reports/app-debug.apk.sha256
            app/pubspec.lock
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  publish-apk:
    needs: [flutter, sqlite, android-runtime]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: dist
      - name: Publish the APK as a direct Release download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: android-preview-${{ github.run_number }}-${{ github.sha }}
        run: |
          test -s dist/Accounting-System-Android.apk
          printf 'نسخة تجربة موقعة للاختبار، مبنية من %s.\n\n' "$GITHUB_SHA" > dist/RELEASE_NOTES.md
          printf 'نجح التحليل والاختبارات والتثبيت والتشغيل على محاكي Android 13.\n' >> dist/RELEASE_NOTES.md
          printf 'نزّل ملف APK نفسه؛ لا تغيّر امتداد ملف ZIP إلى APK.\n' >> dist/RELEASE_NOTES.md
          printf 'المستخدم: demo، كلمة المرور: Demo@2026!\n\n' >> dist/RELEASE_NOTES.md
          printf 'هذه نسخة Preview بتوقيع اختبار وليست إصدار إنتاج بمفتاح توقيع دائم.\n' >> dist/RELEASE_NOTES.md
          gh release create "$RELEASE_TAG" dist/Accounting-System-Android.apk dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title 'النظام المحاسبي — نسخة Android تجريبية' \
            --notes-file dist/RELEASE_NOTES.md --prerelease
  android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - name: Enable Android emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run on Android 13 and launch distributable APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/android-runtime-check.sh
      - name: Upload Android runtime evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-evidence
          path: reports/android-runtime/
      - name: Upload the signed release APK launched on Android
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: |
            dist/Accounting-System-Android.apk
            dist/SHA256SUMS
          if-no-files-found: error
