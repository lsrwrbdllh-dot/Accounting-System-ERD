name: Verify accounting
on:
  push:
    branches: [implementation/sqlite-flutter]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlite-results
          path: reports/
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - name: Inspect Flutter and Android toolchains
        working-directory: app
        continue-on-error: true
        run: flutter doctor -v 2>&1 | tee ../reports/flutter-doctor.log
      - working-directory: app
        run: flutter pub get 2>&1 | tee ../reports/flutter-pub-get.log
      - working-directory: app
        run: flutter analyze 2>&1 | tee ../reports/flutter-analyze.log
      - working-directory: app
        run: timeout 180s flutter test --reporter expanded --timeout 2m 2>&1 | tee ../reports/flutter-test.log
      - working-directory: app
        run: flutter build apk --debug --dart-define=APP_ENV=demo 2>&1 | tee ../reports/flutter-build.log
      - name: Verify APK and record checksum
        run: |
          test -s app/build/app/outputs/flutter-apk/app-debug.apk
          sha256sum app/build/app/outputs/flutter-apk/app-debug.apk > reports/app-debug.apk.sha256
      - name: Upload Flutter diagnostics and resolved dependencies
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-verification-results
          path: |
            reports/flutter-*.log
            reports/app-debug.apk.sha256
            app/pubspec.lock
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - name: Enable Android emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run on Android 13 and launch distributable APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/android-runtime-check.sh
      - name: Upload Android runtime evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-evidence
          path: reports/android-runtime/
      - name: Upload APK launched on Android
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-tested-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
